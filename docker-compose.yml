name: ${COMPOSE_PROJECT_NAME:-omni}

# ── Memory budget (operator rule, 2026-09-18) ─────────────────────────────────
# EVERY service declares an explicit mem_limit and the SUM of all caps stays
# <= 4.5 GB (4544M today) so one stack can never starve the others on the
# shared VM. Adding a service or raising a cap means re-checking that total.
# (workbench 64M -> 512M on 2026-09-18: running the core's own `node --test`
# suite inside that container was OOM-killed, exit 137.)
# (workstation 512M -> 1024M on 2026-09-26, operator directive: a burst of 6
# parallel `agent run` dispatches OOM-killed the production facade; documented
# total 4544M -> 5056M.)
# (toolbox 128M -> 512M and mattermost-db 128M -> 256M on 2026-10-05, operator
# directive; both caps are now tunable from the .env via TOOLBOX_MEM_LIMIT and
# MATTERMOST_DB_MEM_LIMIT. documented total 5056M -> 5568M.)
# (2026-10-05, operator directive: EVERY service's cap is now env-tunable as
# ${<SERVICE>_MEM_LIMIT:-<default>} - e.g. VAR_DOCKER_MEM_LIMIT style names -
# so an operator can raise ANY container's limit from the .env without editing
# this file. The defaults reproduce the committed caps EXACTLY; the documented
# total above is unchanged unless one of those vars is actually set.)
networks:
  obs-net:
    driver: bridge
    internal: true

services:

  #  Core (always running) 

  postgres:
    # Upstream pgvector publishes no `latest` tag, so this default could not be
    # pulled by a fresh host (omnidev bring-up died at "Starting databases").
    # Pinned to the tag production runs; POSTGRES_IMAGE still overrides it.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: omniagent
      POSTGRES_USER: omniagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniagent -d omniagent"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Hard memory cap (see the 4 GB stack budget at the top of this file).
    # Overridable from the .env: POSTGRES_MEM_LIMIT. Recreate to apply.
    mem_limit: ${POSTGRES_MEM_LIMIT:-896m}
    logging:
      driver: journald

  omniagent:
    # Image-only service (like dashboard): the base compose is the stable/
    # runtime definition and carries NO build section - it consumes the PUBLIC
    # CI image published by the omni-deployer pipeline
    # (ghcr.io/nexuslbs/omni-deployer/omniagent:latest), so a fresh machine
    # can `docker compose pull` with no .env and no registry login. Override
    # via OMNIAGENT_IMAGE in .env to pin a version; deploy.py hybrid builds
    # the production Dockerfile locally and tags it local/omniagent:latest
    # (omni.env) before `up`. Only the dev overlay (docker-compose.dev.yml)
    # adds a build section (Dockerfile.dev) for omnidev source builds.
    # (Regression note: 3d4bfd2 had pointed the base compose at
    # Dockerfile.dev; reverted to image-only in d552b9f.)
    image: ${OMNIAGENT_IMAGE:-ghcr.io/nexuslbs/omni-deployer/omniagent:latest}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
        required: false
      # Start-order guard against the boot race (incident 2026-09-21): the
      # omniagent container can come up before the mattermost HTTP port starts
      # accepting connections, and a single `Connection refused` used to leave
      # EVERY mattermost channel without inbound until a manual plugin restart.
      # The mattermost image ships its own HEALTHCHECK, so wait for it whenever
      # the mattermost profile is active; `required: false` keeps omniagent
      # independent when mattermost is not deployed.
      mattermost:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: postgres://omniagent:${POSTGRES_PASSWORD:-}@postgres:5432/omniagent
      OMNI_DIR: ${OMNI_DIR:-/opt/omni}
      # Endpoint of the opt-in 'qdrant' compose profile, consumed by the
      # semantic_search MCP plugin (omni-plugins) via its $env:QDRANT_URL config.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      # Stable/image builds use the committed .sqlx offline cache (no live DB
      # at compile time). The dev overlay overrides this to false so omnidev
      # builds validate queries against the live migrated DB instead.
      SQLX_OFFLINE: "true"
      # DB-write guard lives INSIDE db-migrations (no env toggle): release
      # images (OMNIAGENT_BUILD_MODE=release) auto-apply the idempotent schema
      # on container start; dev-built binaries only write schema against known
      # dev hosts (omnidev-postgres, see docker-compose.dev.yml).
    volumes:
      # NOTE: the omniagent SOURCE repo must NOT be mounted here - omnistable
      # (and any image-based deploy) runs the omniagent binary + built-in
      # plugin binaries fixed in the image, generated by the CI docker build.
      # The dev overlay (docker-compose.dev.yml) mounts the repo at /app for
      # omnidev source builds; the base compose stays pristine for image runs.
      # Data dir: HOST_OMNI_DIR selects the host checkout bound at /opt/omni.
      # Launchers set it (omnidev/omnistable -> omni-root, deploy/omnideploy ->
      # omni-stack); the default /opt/omni covers bare `docker compose up`.
      - ${HOST_OMNI_DIR:-/opt/omni}:/opt/omni:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${WORKSPACE_DIR:-/opt/workspace}:/opt/workspace:rw
    expose:
      - "8080"
    # NOTE: omniagent is expose-only (no host ports). Host ports are a finite
    # resource shared across stacks (omnidev/omnistable/omnideploy) and a footgun
    # for agent-built projects (they collide when a project also wants 8080).
    # Access the API from the host/other containers via `docker exec` or the
    # Docker network (http://omniagent:8080), never via localhost:8080.
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hard memory cap (see the 4 GB stack budget at the top). The dev overlay
    # (docker-compose.dev.yml) raises this to 4g for source builds.
    # Overridable via OMNIAGENT_MEM_LIMIT: deploy.py hybrid/ci write 2048m into
    # omni.env because the deploy suite's GROUP 17B spawns 50 parallel
    # `docker compose` CLI processes INSIDE this container (~660 MB peak on top
    # of a ~400 MB baseline grown by PASS 1), which the 1 GiB default
    # OOM-killed in PASS 2 (exit 137, CONSTRAINT_MEMCG; threads 2741/2744).
    # The DEFAULT stays 1024m, so the shipped stack budget (<= 4.5 GB) and the
    # production footprint are unchanged.
    mem_limit: ${OMNIAGENT_MEM_LIMIT:-1024m}
    logging:
      driver: journald

  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/nexuslbs/omni-deployer/dashboard:latest}
    command: ["node", "/app/server/index.js"]
    # Host port publishing for the dashboard lives in the dev overlay
    # (docker-compose.dev.yml) - host access is a dev-only convenience.
    environment:
      PORT: "3001"
      OMNI_DIR: ${OMNI_DIR:-/opt/omni}
      EXPLORER_DIR: ${EXPLORER_DIR:-/opt}
    volumes:
      - ${HOST_OMNI_DIR:-/opt/omni}/:/opt/omni/:rw
      - ${HOST_OMNI_DIR:-/opt/omni}/user/:/opt/omni/user:rw
      - ${HOST_OMNI_DIR:-/opt/omni}/profiles/:/opt/omni/profiles:rw
      - ${WORKSPACE_DIR:-/opt/workspace}/omni-dashboard:/opt/repo:rw
      - /opt/data:/opt/data:ro
      - ${WORKSPACE_DIR:-/opt/workspace}:/opt/workspace:ro
    # Hard memory cap: the dashboard is a small Node service.
    # Overridable from the .env: DASHBOARD_MEM_LIMIT. Recreate to apply.
    mem_limit: ${DASHBOARD_MEM_LIMIT:-192m}
    logging:
      driver: journald

  toolbox:
    # Image-only (like omniagent/dashboard): consumes the PUBLIC CI image by
    # default (ghcr.io/nexuslbs/omni-deployer/toolbox:latest). Source builds
    # live in the dev overlay (docker-compose.dev.yml).
    image: ${TOOLBOX_IMAGE:-ghcr.io/nexuslbs/omni-deployer/toolbox:latest}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: omniagent
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: omniagent
      OMNI_DIR: /opt/omni-stack
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_PATH: ${S3_PATH:-omni}
      CRON_BACKUP: ${BACKUP_CRON_SCHEDULE}
      CRON_CHECKPOINT: ${CHECKOUT_CRON_SCHEDULE}
    volumes:
      - ./:/opt/omni-stack:rw
      - /opt:/opt/:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - omni-toolbox-cron:/var/log
    # Hard memory cap: the toolbox runs the backup/checkpoint cron jobs.
    # Overridable from the .env: TOOLBOX_MEM_LIMIT (raised 128m -> 512m on
    # operator request, 2026-10-05). Recreate the container to apply.
    mem_limit: ${TOOLBOX_MEM_LIMIT:-128m}
    logging:
      driver: journald

  workstation-tools:
    # The external-interaction TOOLING of the workstation (himalaya email CLI +
    # the general Linux tool set), as a SEPARATE versioned image published from
    # nexuslbs/omni-images (operator 2026-09-26, threads 3165/3166: himalaya
    # moves OUT of the toolbox into workstation-tools). It contains tools/CLIs
    # that RUN AND FINISH - NOT a service: the container stays up with `sleep
    # infinity` purely for exec-based use, exactly like the toolbox the
    # workstation used to exec into. The workstation reaches it through the
    # `container` transport (docker-impl): `docker compose exec -T
    # workstation-tools sh -c <cmd>`. WORKSTATION_TOOLS_IMAGE overrides it.
    # ALWAYS-ON: NO `profiles:` key here - the workstation pair is part of the
    # DEFAULT production stack (operator directive, telegram 3232), so a stack
    # bring-up can never silently omit it. Do NOT re-introduce a profile gate.
    image: ${WORKSTATION_TOOLS_IMAGE:-ghcr.io/nexuslbs/omni-images/workstation-tools:0.0.1}
    restart: unless-stopped
    command: ["sleep", "infinity"]
    # The himalaya wrapper + account config live in the omni-root checkout under
    # /opt/omni (config/himalaya-hermes, config/himalaya-auth.sh,
    # data/himalaya/config.toml). himalaya-impl shells out THROUGH this service:
    #   docker compose --project-directory /opt/omni exec -T workstation-tools \
    #     sh -c '/opt/omni/config/himalaya-hermes account list -o json'
    # so those absolute paths must resolve INSIDE this container. Without this
    # bind the CLI exits 127 (`sh: /opt/omni/config/himalaya-hermes: not found`,
    # verified 2026-09-26) and the whole email tool family of the workstation
    # facade is dead. Read-only on purpose: this container RUNS tools, it never
    # writes the checkout.
    volumes:
      - /opt/omni:/opt/omni:ro
    # Hard memory cap: sleep-only base, but the 0.0.9 image adds mongosh/gitleaks/trivy/semgrep which need headroom (mongosh OOM-killed at 128m, verified 2026-09-30).
    # Overridable from the .env: WORKSTATION_TOOLS_MEM_LIMIT. Recreate to apply.
    mem_limit: ${WORKSTATION_TOOLS_MEM_LIMIT:-512m}
    logging:
      driver: journald

  workstation-datasci:
    # The DATA-SCIENCE concern image of the workstation equipment layer
    # (gap-analysis report E2, operator decisions B/M): numpy/pandas/scipy/
    # matplotlib/sklearn + jupyter on a DEBIAN base (python:3.11-slim) - the
    # Alpine/musl wheels for the stack are painful, so it is NOT forced into
    # the Alpine workstation-tools base. It contains tools that RUN AND FINISH
    # (sleep infinity for exec-based use), reached through the `container`
    # transport (docker-impl): `docker compose exec -T workstation-datasci
    # sh -c <cmd>`, or on demand with `docker run --rm -i <image>`.
    # PROFILE-GATED (operator M: on-demand profiles, like the browser): starts
    # with `--profile datasci` (or `all`). WORKSTATION_DATASCI_IMAGE overrides.
    profiles: ["datasci", "all"]
    image: ${WORKSTATION_DATASCI_IMAGE:-ghcr.io/nexuslbs/omni-images/workstation-datasci:0.0.1}
    restart: unless-stopped
    command: ["sleep", "infinity"]
    # Data-science work is RAM hungry, but the container is idle between execs.
    # Overridable from the .env: WORKSTATION_DATASCI_MEM_LIMIT. Recreate to apply.
    mem_limit: ${WORKSTATION_DATASCI_MEM_LIMIT:-512m}
    logging:
      driver: journald

  workstation-office:
    # The OFFICE/OCR concern image (gap-analysis report E4/E5, operator D/M):
    # pandoc, tesseract-ocr, poppler-utils + python-docx/openpyxl/reportlab/
    # pptx/pypdf. LibreOffice stays OUT (it would blow the 350 MB budget; only
    # a separate opt-in image if a project needs ODF/legacy rendering).
    # PROFILE-GATED: starts with `--profile office` (or `all`).
    # WORKSTATION_OFFICE_IMAGE overrides.
    profiles: ["office", "all"]
    image: ${WORKSTATION_OFFICE_IMAGE:-ghcr.io/nexuslbs/omni-images/workstation-office:0.0.1}
    restart: unless-stopped
    command: ["sleep", "infinity"]
    # Overridable from the .env: WORKSTATION_OFFICE_MEM_LIMIT. Recreate to apply.
    mem_limit: ${WORKSTATION_OFFICE_MEM_LIMIT:-256m}
    logging:
      driver: journald

  workstation-media:
    # The MEDIA/TRANSCRIPTION concern image (gap-analysis report E6/E8,
    # operator F/M): ffmpeg (MOVED OUT of the main workstation image per
    # decision F), imagemagick (codec/security cadence -> Zone 2) and
    # faster-whisper as the transcription engine. PROFILE-GATED: starts with
    # `--profile media` (or `all`). WORKSTATION_MEDIA_IMAGE overrides.
    profiles: ["media", "all"]
    image: ${WORKSTATION_MEDIA_IMAGE:-ghcr.io/nexuslbs/omni-images/workstation-media:0.0.1}
    restart: unless-stopped
    command: ["sleep", "infinity"]
    # Transcription loads model weights into RAM (faster-whisper small/base).
    # Overridable from the .env: WORKSTATION_MEDIA_MEM_LIMIT. Recreate to apply.
    mem_limit: ${WORKSTATION_MEDIA_MEM_LIMIT:-1g}
    logging:
      driver: journald

  #  workbench: agent equipment layer (plugins host, long-running) 
  workbench:
    # Opt-in service: gated behind the "workbench" (or "all") compose profile -
    # it is NOT part of the default stack. The base compose is the stable/runtime
    # definition and is IMAGE-ONLY: it carries NO build section. The image is
    # built from services/workbench/Dockerfile (build args WORKBENCH_REPO_URL /
    # WORKBENCH_REF) by the dev overlay (docker-compose.dev.yml). The container
    # start clones and installs NOTHING: it boots the plugins and stays up (the
    # core's `serve` command). workbench is agent-agnostic - this service is the
    # only coupling with the stack.
    profiles: ["workbench", "all"]
    # Default: the PUBLISHED core image (ghcr.io/nexuslbs/workbench:latest,
    # built by the core repo's CI); WORKBENCH_IMAGE overrides it.
    image: ${WORKBENCH_IMAGE:-ghcr.io/nexuslbs/workbench:latest}
    restart: unless-stopped
    # Long-running mode: `serve` boots the plugins behind a status endpoint and
    # blocks until SIGINT/SIGTERM (a sleep loop would report Up while hosting
    # nothing). --max-old-space-size keeps the V8 heap inside mem_limit.
    command: ["node", "--max-old-space-size=384", "src/cli.ts", "serve"]
    environment:
      # Plugins config file (the WORKBENCH_CONFIG_FILE .env var overrides it).
      # EMPTY (the default) = the core default config shipped in the image
      # (/workbench/workbench.config.yml, core plugins only). Non-empty = that
      # exact path, e.g. the operator's
      # WORKBENCH_CONFIG_FILE=/opt/omni/config/workbench.yml (a tracked file of
      # the omni-root stack) - see .env.example.
      CONFIG_FILE: ${WORKBENCH_CONFIG_FILE:-}
      # Status endpoint port of `serve` INSIDE the container (the core's
      # WORKBENCH_PORT, default 8080); the dev overlay publishes it on the host
      # as 12347:8080.
      WORKBENCH_PORT: ${WORKBENCH_PORT:-8080}
      # Where git plugin sources are checked out. Backed by the EXTERNAL NAMED
      # VOLUME `workbench-cache` (declared in the service's volumes list and in
      # the top-level volumes: block below): the checkout survives container
      # recreation and never pollutes the tracked /opt/omni config directory of
      # the host. WORKBENCH_CACHE_DIR is the path INSIDE the container.
      WORKBENCH_CACHE_DIR: ${WORKBENCH_CACHE_DIR:-/var/lib/workbench/sources}
      # Omni root of the deployment whose stack the plugins may exec INTO: the
      # `container` transport (docker-impl) launches
      #   docker compose --project-directory <OMNI_DIR> ... exec -T <service>
      # so the plugins config derives the compose project from it
      # (`${env:OMNI_DIR}`, e.g. himalaya -> service `toolbox`). Same convention
      # as the omniagent / dashboard services of this stack.
      OMNI_DIR: ${OMNI_DIR:-/opt/omni}
      # Compose project name of that stack. The transport's compose block may
      # omit `project_name`, in which case the docker CLI falls back to
      # COMPOSE_PROJECT_NAME (and then to the project directory basename - a
      # CHECKOUT name, not the runtime project name). Pinned to the production
      # project here; a deployment overrides it (dev: `omnidev`, inherited from
      # the launch env file).
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-omni-stack}
    volumes:
      # /opt mapped IN AND OUT: a CONFIG_FILE under /opt/... resolves to the
      # SAME host file inside the container (this is how the operator's
      # /opt/omni/config/workbench.yml is read, and how the dev overlay reaches
      # /opt/workspace/workbench-plugins/config.yml). The image's own checkout
      # lives in /workbench, outside /opt, so this mount never shadows it.
      - /opt:/opt:rw
      # EXTERNAL NAMED VOLUME (NOT a bind mount): the `git` plugin-source
      # checkout persists across container recreation and never leaks into the
      # host tree. WORKBENCH_CACHE_DIR is the path INSIDE the container; the
      # volume itself is declared in the top-level `volumes:` below.
      - workbench-cache:${WORKBENCH_CACHE_DIR:-/var/lib/workbench/sources}:rw
      # DOCKER DAEMON SOCKET (the host daemon, not a daemon in this container):
      # the workbench plugins reach external tooling BEHIND THE SCENES through
      # the `container` transport, which is
      #   docker compose -p <project> --env-file <env> -f <file> exec -T
      #     <service> sh -c '<args>'
      # - i.e. it needs the docker CLIENT (shipped in the image) plus access to
      # the daemon that owns the stack it exec's into. /opt is mounted in-and-out
      # above, so the SAME compose file / .env paths resolve inside and outside
      # the container; this socket is what lets that client talk to the daemon.
      # SECURITY: a container with the docker socket has control of the host
      # docker daemon, which is equivalent to host root. That is the accepted
      # cost of reaching a sibling service (himalaya lives only in the omni
      # `workstation-tools` image) without publishing a network path. Optional hardening
      # (NOT used here): a socket proxy such as tecnativa/docker-socket-proxy
      # exposing only CONTAINERS/EXEC, and mounting its endpoint instead.
      - /var/run/docker.sock:/var/run/docker.sock:rw
    expose:
      # Container-INTERNAL port (never a host port): the dev overlay publishes
      # it on the host as 12347:8080.
      - "8080"
    healthcheck:
      # curl (installed in the service image) probes the status endpoint, so the
      # service is verifiably HOSTING the plugins, not merely running.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${WORKBENCH_PORT:-8080}/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Hard memory cap: the core is a small plugin host, but 64M (with a 32M V8
    # heap) is too small to run the core's own test suite inside this container:
    # `node --test` was OOM-killed (exit 137). 512M fits `serve` plus one
    # on-demand test run; the stack budget (top of file) was re-checked.
    # Overridable from the .env: WORKBENCH_MEM_LIMIT. Recreate to apply.
    mem_limit: ${WORKBENCH_MEM_LIMIT:-512M}
    logging:
      driver: journald

  workstation:
    # ALWAYS-ON service: NO `profiles:` key here - it is part of the DEFAULT
    # production stack, so any bring-up starts it and the facade
    # http://workstation:8080 is always reachable (operator directive, telegram
    # 3232: "Production workstation MUST work, always"). Do NOT re-introduce a
    # profile gate. The base compose is the stable/runtime
    # definition and is IMAGE-ONLY: it carries NO build section (the dev overlay
    # docker-compose.dev.yml builds the image from services/workstation/Dockerfile).
    # workstation is AGENT-AGNOSTIC: it needs NO omniagent setup and receives
    # EXACTLY TWO env vars (WORKSTATION_CONFIG_FILE + WORKSTATION_CACHE_DIR),
    # plus DSH_HOME (the harness home: role profiles + credential store).
    # The HTTP port (8080) is served by the native `http-surface` plugin of the
    # plugin sources (see config/workstation.yml), NOT by an env var.
    # Default: the PUBLISHED core image (ghcr.io/nexuslbs/deepseek-harness:latest,
    # built by the core fork's publish workflow); WORKSTATION_IMAGE overrides it.
    image: ${WORKSTATION_IMAGE:-ghcr.io/nexuslbs/deepseek-harness:latest}
    restart: unless-stopped
    # The published image is a BARE harness (CMD --profile headless, no bundled
    # plugins, no entrypoint): the tracked omni-root entrypoint (mounted below)
    # clones the plugin sources into the cache volume and boots the harness with
    # the config patch ($WORKSTATION_CONFIG_FILE). The native `http-surface`
    # plugin serves /health + /api/tool/call on 8080.
    command: ["sh", "/usr/local/bin/workstation-entrypoint"]
    environment:
      # Plugins config file: the cordis patch overlay that defines every
      # capability (email, sms, totp, browser, web). A RUN-TIME input only,
      # never an image layer. Default: the operator's tracked file of the
      # omni-root stack (same path inside and outside the container through the
      # /opt:/opt mount).
      WORKSTATION_CONFIG_FILE: ${WORKSTATION_CONFIG_FILE:-/opt/omni/config/workstation.yml}
      # The HARNESS HOME: role profiles ($DSH_HOME/profiles/<role>), the credential
      # store ($DSH_HOME/.credentials.yaml) and the session state. It MUST live in
      # the NON-VERSIONED omni data tree so the periodic backups cover it and it can
      # never be committed: the image ENV default (/var/lib/workstation) is the
      # container's writable layer and is LOST on every recreate. WORKSTATION_DSH_HOME
      # overrides it (the dev stack sets its own omni tree).
      DSH_HOME: ${WORKSTATION_DSH_HOME:-/opt/omni/data/workstation/dsh-home}
      # Where the git plugin sources are checked out (entrypoint.sh clones them
      # ONCE into this dir). Backed by the EXTERNAL NAMED VOLUME
      # `workstation-cache` (declared below): the checkout survives container
      # recreation. The volume mapping below uses the SAME path, so
      # $WORKSTATION_CACHE_DIR IS where the sources are stored.
      WORKSTATION_CACHE_DIR: ${WORKSTATION_CACHE_DIR:-/var/lib/workstation/sources}
      # ── PRIVATE plugin source (nexuslbs/workstation-plugins-private) ──────
      # The authenticated-access + captcha capability plugins are PRIVATE and are
      # cloned by services/workstation/clone-private-plugins.mjs BEFORE the
      # harness boots (the harness has no `source` concept). The GitHub App
      # private key is OPERATOR-PROVIDED at deploy time (env file / secret); the
      # app and installation ids are numeric and not secrets. With no key the
      # step logs a WARN and the public set boots unchanged (non-fatal).
      WORKSTATION_PLUGINS_PRIVATE_REPO_URL: ${WORKSTATION_PLUGINS_PRIVATE_REPO_URL:-https://github.com/nexuslbs/workstation-plugins-private}
      WORKSTATION_PLUGINS_PRIVATE_REF: ${WORKSTATION_PLUGINS_PRIVATE_REF:-main}
      # ONE app identity for the whole workstation service: the git credential
      # helper (workstation/bin/gh-cred) and the private-source mint
      # (services/workstation/clone-private-plugins.mjs) MUST use the app that
      # owns the PEM on the NON-VERSIONED credentials tree. GITHUB_APP_ID /
      # GITHUB_INSTALLATION_ID are the shared source of truth; the
      # WORKSTATION_PLUGINS_PRIVATE_* ids default to the same values, so the two
      # paths can never drift apart again (thread 3243 lost the private source to
      # exactly that drift: the mint was pointed at a STALE key file).
      # Verified 2026-09-26 (thread 3252): app 3967918 = nexuslbs-app,
      # GET /app -> HTTP 200 and POST /app/installations/138119822/access_tokens
      # -> HTTP 201 for /opt/omni/data/credentials/github-app.pem.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-3967918}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-138119822}
      WORKSTATION_PLUGINS_PRIVATE_APP_ID: ${WORKSTATION_PLUGINS_PRIVATE_APP_ID:-${GITHUB_APP_ID:-3967918}}
      WORKSTATION_PLUGINS_PRIVATE_INSTALLATION_ID: ${WORKSTATION_PLUGINS_PRIVATE_INSTALLATION_ID:-${GITHUB_INSTALLATION_ID:-138119822}}
      WORKSTATION_PLUGINS_PRIVATE_APP_KEY: ${WORKSTATION_PLUGINS_PRIVATE_APP_KEY:-${GITHUB_APP_KEY:-}}
      # The App PEM lives on the NON-VERSIONED credentials tree (mode 600) and is
      # read from FILE when no PEM is passed in the environment. The deployment's
      # git credential helper (workstation/bin/gh-cred, installed by
      # entrypoint.sh) reads the SAME file, so the App key has exactly ONE
      # location and is NEVER versioned.
      WORKSTATION_PLUGINS_PRIVATE_APP_KEY_FILE: ${WORKSTATION_PLUGINS_PRIVATE_APP_KEY_FILE:-/opt/omni/data/credentials/github-app.pem}
      GITHUB_APP_KEY_FILE: ${GITHUB_APP_KEY_FILE:-/opt/omni/data/credentials/github-app.pem}
      # --- Concern exec target ---------------------------------------------
      # container-exec (config/workstation.yml row) runs concern commands as
      # `docker compose --project-directory <dir> exec -T <service>`. The plugin
      # resolves <dir> as: config row `projectDir` > this env > the production
      # /opt/omni default. Without a project name the docker CLI falls back to
      # COMPOSE_PROJECT_NAME. The defaults below keep the current production
      # behaviour (omni-stack / empty); the omnidev overlay pins
      # COMPOSE_PROJECT_NAME=omnidev in docker-compose.dev.yml, and omnistable /
      # the deployer pass their own values.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-omni-stack}
      WORKSTATION_EXEC_PROJECT: ${WORKSTATION_EXEC_PROJECT:-}
    volumes:
      # /opt mapped IN AND OUT: the operator's config/workstation.yml and the
      # tracked entrypoint under /opt/omni/services/workstation resolve to the
      # SAME host files inside the container. The image's own checkout lives in
      # /harness, outside /opt, so this mount never shadows it.
      - /opt:/opt:rw
      # The tracked container entrypoint (omni-root services/workstation/
      # entrypoint.sh): the published image ships NO entrypoint, so the compose
      # command above runs it from the bind-mounted /opt tree.
      - /opt/omni/services/workstation/entrypoint.sh:/usr/local/bin/workstation-entrypoint:ro
      # THE HARNESS HOME, PERSISTED (role profiles + .credentials.yaml +
      # sessions): a NON-VERSIONED bind of the omni data tree. Without it the
      # harness home is the container's WRITABLE LAYER and every recreate wipes
      # it - observed thread 3263: after the entrypoint-fix recreate `web search`
      # answered `web-search.not-configured` and `agent run` could not provision
      # ANY role (`no profile at /var/lib/workstation/profiles/<role>`). DSH_HOME
      # (above) points at the SAME tree through the /opt mount; this bind
      # additionally makes the image's own default path
      # ($DSH_HOME=/var/lib/workstation) persistent, so neither path can regress
      # into the writable layer. Docker sorts mounts by destination depth, so the
      # named `sources` volume below still wins for
      # /var/lib/workstation/sources.
      - /opt/omni/data/workstation/dsh-home:/var/lib/workstation:rw
      # EXTERNAL NAMED VOLUME (NOT a bind mount): the `git` plugin-source
      # checkout persists across container recreation and never leaks into the
      # host tree. WORKSTATION_CACHE_DIR is the path INSIDE the container; the
      # volume itself is declared in the top-level `volumes:` below.
      - workstation-cache:${WORKSTATION_CACHE_DIR:-/var/lib/workstation/sources}:rw
      # DOCKER DAEMON SOCKET (the host daemon, not a daemon in this container):
      # the workstation plugins reach external tooling BEHIND THE SCENES through
      # the `container` transport, which is
      #   docker compose -p <project> --env-file <env> -f <file> exec -T
      #     <service> sh -c '<args>'
      # - i.e. it needs the docker CLIENT (shipped in the image) plus access to
      # the daemon that owns the stack it exec's into. /opt is mounted in-and-out
      # above, so the SAME compose file / .env paths resolve inside and outside
      # the container; this socket is what lets that client talk to the daemon.
      # SECURITY: a container with the docker socket has control of the host
      # docker daemon, which is equivalent to host root. That is the accepted
      # cost of reaching a sibling service (himalaya lives only in the omni
      # `workstation-tools` image) without publishing a network path. Optional hardening
      # (NOT used here): a socket proxy such as tecnativa/docker-socket-proxy
      # exposing only CONTAINERS/EXEC, and mounting its endpoint instead.
      - /var/run/docker.sock:/var/run/docker.sock:rw
    expose:
      # Container-INTERNAL port (never a host port): the dev overlay publishes
      # it on the host as 12348:8080.
      - "8080"
    healthcheck:
      # curl (installed in the service image) probes the status endpoint, so the
      # service is verifiably HOSTING the plugins, not merely running. The port
      # is the http-surface plugin's fixed 8080 - NO env var (omniagent-agnostic rule).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Hard memory cap (raised 512M -> 1024M on 2026-09-26, operator directive):
    # 512M was OOM-killed by a burst of 6 PARALLEL `agent run` dispatches - the
    # facade died (all calls fetch failed, /health unreachable) and only the
    # `restart: unless-stopped` policy brought it back, with NO recreate. 1G
    # keeps several concurrent agent runs alive; the stack budget (top of file)
    # was re-checked.
    # Overridable from the .env: WORKSTATION_MEM_LIMIT. Recreate to apply.
    mem_limit: ${WORKSTATION_MEM_LIMIT:-1024M}
    logging:
      driver: journald

  #  Browser service (profile: browser) - a SEPARATE image, never the workstation image 
  # The published workstation image stays BROWSER-FREE (no chromium): the
  # `browser-use-playwright` provider only ATTACHES to this service over CDP,
  # resolved through the general-service@1 seam
  # (`browser-use-playwright.browserService.endpoint` -> http://browser:9222).
  # Opt-in service: gated behind the "browser" (or "all") compose profile, so it
  # is NOT part of the default stack and nothing is pulled/started unless asked.
  browser:
    profiles: ["browser", "all"]
    # Published from nexuslbs/omni-images/browser (built FROM the upstream Playwright
    # image, chromium baked in). BROWSER_IMAGE overrides it.
    image: ${BROWSER_IMAGE:-ghcr.io/nexuslbs/omni-images/browser:0.0.4}
    restart: unless-stopped
    # Chromium needs a bigger /dev/shm than the docker default (64M).
    shm_size: 1gb
    environment:
      BROWSER_CDP_PORT: "9222"
    expose:
      # Container-INTERNAL CDP port: reached as browser:9222 on the stack
      # network. No host port is published - the CDP endpoint has no auth, so it
      # must never be exposed outside the stack.
      - "9222"
    # Hard memory cap. This service is opt-in (profile "browser"), so its cap is
    # NOT part of the always-on stack budget; re-check the budget before enabling
    # it next to the default services.
    # Overridable from the .env: BROWSER_MEM_LIMIT. Recreate to apply.
    mem_limit: ${BROWSER_MEM_LIMIT:-1024M}
    logging:
      driver: journald

  #  Observability: Cloudflare Tunnel 
  cloudflared:
    profiles: ["tunnel", "all"]
    build:
      context: services/cloudflared
      dockerfile: Dockerfile
      args:
        CLOUDFLARED_IMAGE: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    # Overridable from the .env: CLOUDFLARED_MEM_LIMIT. Recreate to apply.
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-64M}
    logging:
      driver: journald

  #  Mattermost (profile: mattermost) 
  mattermost-db:
    # `latest` now resolves to PostgreSQL 18, which refuses the
    # /var/lib/postgresql/data mount used below (18+ wants a mount at
    # /var/lib/postgresql), so the service never became healthy.
    image: ${MATTERMOST_DB_IMAGE:-postgres:16.14}
    profiles: ["mattermost", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${MM_POSTGRES_PASSWORD}
      POSTGRES_DB: mattermost
    volumes:
      - mm-db:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Overridable from the .env: MATTERMOST_DB_MEM_LIMIT (raised 128M -> 256M
    # on operator request, 2026-10-05). Recreate the container to apply.
    mem_limit: ${MATTERMOST_DB_MEM_LIMIT:-128M}
    logging:
      driver: journald

  mattermost:
    image: ${MATTERMOST_IMAGE:-mattermost/mattermost-team-edition:10.11.20}
    profiles: ["mattermost", "all"]
    restart: unless-stopped
    command: ["mattermost", "server"]
    depends_on:
      mattermost-db:
        condition: service_healthy
    expose:
      - "8065"
    # Host port publishing for mattermost lives in the dev overlay
    # (docker-compose.dev.yml). Agents/platforms talk to it internally via
    # http://mattermost:8065 - no host mapping needed.
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${MM_POSTGRES_PASSWORD}@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MM_SITEURL:-}
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: true
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: true
    volumes:
      - mm-config:/mattermost/config:rw
      - mm-data:/mattermost/data:rw
      - mm-logs:/mattermost/logs:rw
      - mm-plugins:/mattermost/plugins:rw
    # Overridable from the .env: MATTERMOST_MEM_LIMIT. Recreate to apply.
    mem_limit: ${MATTERMOST_MEM_LIMIT:-512M}
    logging:
      driver: journald

  #  Paperclip (profile: paperclip) 
  paperclip:
    # Pinned to the last FIXED release tag (v2026.722.0, commit e55d702).
    # GHCR carries no semver tags - only `latest` (MUTABLE, currently a newer
    # build than the newest release), canary/beta/nightly, and one sha-<7>
    # tag per build. sha-e55d702 matches release v2026.722.0 (verified
    # 2026-08-16 via `docker manifest inspect`); do NOT switch to `latest`.
    # BETTER_AUTH_SECRET is REQUIRED (vendor-enforced at container start -
    # paperclip refuses to run without it; compose stays green so other
    # profiles are unaffected). LLM keys (OPENAI_API_KEY / ANTHROPIC_API_KEY)
    # are operator-provided via env/secrets when agents need them -
    # intentionally not hardcoded here.
    image: ${PAPERCLIP_IMAGE:-ghcr.io/paperclipai/paperclip:sha-e55d702}
    profiles: ["paperclip", "all"]
    restart: unless-stopped
    expose:
      - "3100"
    # Host port publishing for the paperclip UI lives in the dev overlay
    # (docker-compose.dev.yml), matching the mattermost/dashboard pattern.
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_DEPLOYMENT_MODE: "${PAPERCLIP_DEPLOYMENT_MODE:-authenticated}"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "${PAPERCLIP_DEPLOYMENT_EXPOSURE:-private}"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://paperclip:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:-}"
    volumes:
      - paperclip-data:/paperclip
    # Overridable from the .env: PAPERCLIP_MEM_LIMIT. Recreate to apply.
    mem_limit: ${PAPERCLIP_MEM_LIMIT:-64M}
    logging:
      driver: journald

  #  Memory: Hindsight (profile: memory) 
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2}
    # Individual profiles: 'qdrant' starts ONLY qdrant; 'hindsight' starts ONLY
    # hindsight; 'memory' (legacy) forces BOTH. Use the single-service profile
    # when only one is needed (2026-08-13: omnistable runs neither - profiles
    # are opt-in via COMPOSE_PROFILES/--profile).
    profiles: ["memory", "qdrant", "all"]
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    # Overridable from the .env: QDRANT_MEM_LIMIT. Recreate to apply.
    mem_limit: ${QDRANT_MEM_LIMIT:-128M}
    logging:
      driver: journald

  hindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:latest}
    # Individual profiles: 'hindsight' starts ONLY hindsight; 'qdrant' starts
    # ONLY qdrant; 'memory' (legacy) forces BOTH. Use the single-service
    # profile when only one is needed (2026-08-13: omnistable runs neither -
    # profiles are opt-in via COMPOSE_PROFILES/--profile).
    profiles: ["memory", "hindsight", "all"]
    restart: unless-stopped
    expose:
      - "8888"
      - "9999"
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    # Overridable from the .env: HINDSIGHT_MEM_LIMIT. Recreate to apply.
    mem_limit: ${HINDSIGHT_MEM_LIMIT:-64M}
    logging:
      driver: journald

  #  Observability: Metrics: cAdvisor → Prometheus 
  cadvisor:
    profiles: ["cadvisor", "all"]
    image: ${CADVISOR_IMAGE:-ghcr.io/google/cadvisor:latest}
    restart: unless-stopped
    privileged: true
    command:
      - "--docker_only"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    # Overridable from the .env: CADVISOR_MEM_LIMIT. Recreate to apply.
    mem_limit: ${CADVISOR_MEM_LIMIT:-64M}
    logging:
      driver: journald

  prometheus:
    profiles: ["monitor", "cadvisor", "all"]
    build:
      context: services/prometheus
      dockerfile: Dockerfile
      args:
        PROMETHEUS_IMAGE: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    restart: unless-stopped
    user: root
    extra_hosts:
      - 'host:host-gateway'
    entrypoint:
      - '/bin/prometheus'
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - prometheus-vol:/prometheus:rw
    # Overridable from the .env: PROMETHEUS_MEM_LIMIT. Recreate to apply.
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-128M}
    logging:
      driver: journald

  #  Observability: Log Pipeline: Vector → Loki 
  vector:
    profiles: ["logs", "all"]
    build:
      context: services/vector
      dockerfile: Dockerfile
      args:
        VECTOR_IMAGE: ${VECTOR_IMAGE:-timberio/vector:latest}
    restart: unless-stopped
    environment:
      # Container-name label used for vector's own logs. Auto-named per project
      # ({COMPOSE_PROJECT_NAME}-vector-1) so multiple projects can run
      # side-by-side without colliding on a fixed name.
      VECTOR_SELF_CONTAINER: "${COMPOSE_PROJECT_NAME:-omni}-vector-1"
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /run/systemd/journal:/run/systemd/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - vector-vol:/var/lib/vector:rw
    user: "0"
    networks:
      - obs-net
    depends_on:
      - loki
    # Overridable from the .env: VECTOR_MEM_LIMIT. Recreate to apply.
    mem_limit: ${VECTOR_MEM_LIMIT:-128M}
    # CRITICAL: must NOT use the journald driver (same rule as the omni-root repo's
    # vector). The console sink writes every processed log to stdout; with the
    # journald driver that output re-enters the journald source -> infinite
    # amplification loop. Observed 2026-08-13 on the omni host: /var/log/syslog grew
    # to 88GB in ~2 days (2.7MB/s). json-file keeps vector's own output OUT of
    # the journald source.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  loki:
    profiles: ["logs", "all"]
    build:
      context: services/loki
      dockerfile: Dockerfile
      args:
        LOKI_IMAGE: ${LOKI_IMAGE:-grafana/loki:latest}
    restart: unless-stopped
    volumes:
      - loki-vol:/loki:rw
    networks:
      - obs-net
    command: -config.file=/etc/loki/loki-config.yaml
    user: root
    # Overridable from the .env: LOKI_MEM_LIMIT. Recreate to apply.
    mem_limit: ${LOKI_MEM_LIMIT:-192M}
    logging:
      driver: journald

  #  Observability: Dashboards 
  grafana:
    profiles: ["logs", "monitor", "cadvisor", "all"]
    build:
      context: services/grafana
      dockerfile: Dockerfile
      args:
        GRAFANA_IMAGE: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    restart: unless-stopped
    user: root
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana-vol:/var/lib/grafana:rw
    networks:
      - default
      - obs-net
    depends_on:
      loki:
        condition: service_started
        required: false
    # Overridable from the .env: GRAFANA_MEM_LIMIT. Recreate to apply.
    mem_limit: ${GRAFANA_MEM_LIMIT:-256M}
    logging:
      driver: journald

  #  Noop Provider (profile: noop) 
  noop-provider:
    profiles: ["noop", "all"]
    build:
      context: services/noop
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Overridable from the .env: NOOP_PROVIDER_MEM_LIMIT. Recreate to apply.
    mem_limit: ${NOOP_PROVIDER_MEM_LIMIT:-64M}
    logging:
      driver: journald


volumes:
  postgres_data:
  qdrant_data:
  hindsight-data:
  omniagent-target:
  mm-db:
  mm-config:
  mm-data:
  mm-logs:
  mm-plugins:
  paperclip-data:
  omni-toolbox-cron:
  loki-vol:
  grafana-vol:
  prometheus-vol:
  vector-vol:
  workbench-cache:

  workstation-cache:
